# Para ativar o GitHub Actions no repositório:
# 1. Renomeie este arquivo para .github/workflows/build.yml no próprio site do GitHub ou via Git com um token com escopo 'workflow'.

name: Build GoldOverlay APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoldOverlay-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
